<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#0f7c80; --teal-deep:#0e4f55; --ink:#123b3f; --text:#2d3e40; --muted:#5b6f72;
    --page:#eef3f3; --card:#ffffff; --closed:#f5f9f9; --line:#dde8e9; --mat:#e3eeee; --tip:#e8f4f4;
    --mark:#ee6a3c; --mark-soft:rgba(238,106,60,.18); --warn-bg:#fdeee6; --warn:#8a3a17;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:'Assistant',Calibri,Arial,sans-serif;background:var(--page);color:var(--text);letter-spacing:-0.01em;line-height:1.6}
  .wrap{max-width:1180px;margin:0 auto;padding:36px 20px 70px}

  /* ---- header ---- */
  header.hero{background:var(--card);border-radius:22px;padding:36px 32px 30px;text-align:center;box-shadow:0 10px 30px rgba(14,79,85,.08)}
  .hero .kicker{display:inline-block;font-weight:700;font-size:14px;color:var(--teal);background:var(--tip);border-radius:999px;padding:4px 14px;margin-bottom:12px}
  .hero h1{font-size:clamp(28px,4vw,38px);font-weight:800;color:var(--teal-deep);line-height:1.2}
  .hero p.sub{font-size:18px;color:var(--muted);margin-top:8px}
  .toc{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:26px}
  .toc button{display:block;width:100%;font:inherit;cursor:pointer;color:var(--ink);background:var(--closed);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:17px;text-align:right;transition:box-shadow .2s,transform .2s}
  .toc button:hover{box-shadow:0 6px 16px rgba(14,79,85,.12);transform:translateY(-1px)}
  .toc button b{color:var(--teal);margin-inline-end:6px}
  .toc small{display:block;color:var(--muted);font-size:14px;margin-top:2px}
  .tools{display:flex;justify-content:center;gap:10px;margin-top:18px}
  .tools button{font:600 15px 'Assistant',Calibri,sans-serif;color:var(--teal);background:none;border:1px solid var(--line);border-radius:999px;padding:6px 16px;cursor:pointer}
  .tools button:hover{background:var(--tip)}
  .scope{font-size:14.5px;color:var(--muted);margin-top:14px}

  /* ---- chapters & steps ---- */
  .chapter{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800;color:var(--teal-deep);margin:40px 6px 14px;scroll-margin-top:16px}
  .chapter span{font-size:14px;font-weight:700;color:#fff;background:var(--teal);border-radius:999px;padding:3px 12px}
  .step{scroll-margin-top:12px;background:var(--closed);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden;transition:background .2s,box-shadow .2s}
  .step.open{background:var(--card);border-color:#cfe2e3;box-shadow:0 8px 24px rgba(14,79,85,.10)}
  .step-h{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:16px;width:100%;padding:16px 20px;cursor:pointer}
  .step-h:focus-visible{outline:3px solid var(--mark);outline-offset:-3px;border-radius:16px}
  .num{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--teal);color:#fff;font-weight:800;font-size:19px;box-shadow:0 3px 8px rgba(15,124,128,.28)}
  .st{flex:1;font-size:20px;font-weight:700;color:var(--ink)}
  .chev{flex:none;width:12px;height:12px;border-left:2.5px solid var(--teal);border-bottom:2.5px solid var(--teal);transform:rotate(-45deg);transition:transform .25s;margin-inline-start:6px}
  .step.open .chev{transform:rotate(135deg)}
  .step-b{display:none;padding:6px 20px 26px}
  .step.open .step-b{display:block}

  .row{display:grid;grid-template-columns:300px 1fr;gap:28px;align-items:start}
  .row + .row{margin-top:26px;padding-top:24px;border-top:1px dashed var(--line)}
  .row.one{grid-template-columns:1fr}
  .row.wide{grid-template-columns:minmax(0,1fr) minmax(0,440px)}
  .wide-mark{display:none}
  .media{min-width:0}
  .text{font-size:17px}
  .text p{margin-bottom:10px}
  .text ol{padding-inline-start:22px}
  .text li{margin-bottom:8px}
  .text h4{font-size:18px;color:var(--ink);margin-bottom:6px}
  .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--mark);color:#fff;font-size:13px;font-weight:800;vertical-align:1px;margin-inline-start:2px}
  .tip{margin-top:12px;background:var(--tip);color:#1c4a4e;border-radius:10px;padding:10px 14px;font-size:15.5px}
  .tip.soft{background:transparent;border:1px dashed #c7dcdd}
  .rule{margin-top:14px;background:#fff6ef;border-inline-start:4px solid var(--mark);border-radius:6px;padding:10px 14px;font-size:16px;color:#5a2a12}

  table.lvl{width:100%;border-collapse:separate;border-spacing:0;font-size:15.5px;margin-top:6px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .lvl th{background:var(--teal);color:#fff;text-align:right;padding:8px 10px;font-weight:700}
  .lvl td{padding:9px 10px;vertical-align:top;border-top:1px solid var(--line)}
  .lvl td:first-child{width:38%;color:var(--ink)}
  .lvl tr:nth-child(even) td{background:#f7fafa}

  a.go{display:inline-block;margin:4px 0 10px;font-weight:700;font-size:17px;color:#fff;background:var(--teal);border-radius:999px;padding:8px 20px;text-decoration:none;direction:ltr;box-shadow:0 3px 8px rgba(15,124,128,.25)}
  a.go:hover{background:var(--teal-deep)}
  /* ---- screenshots ---- */
  .mat{background:var(--mat);border-radius:14px;padding:8px}
  .mat + .mat{margin-top:12px}
  .shot{position:relative;border-radius:8px;overflow:hidden;line-height:0;background:#fff;cursor:zoom-in;box-shadow:0 2px 6px rgba(0,0,0,.06)}
  .shot img{width:100%;height:auto;display:block}
  .mk{position:absolute;border:3.5px solid var(--mark);box-shadow:0 0 0 4px var(--mark-soft);pointer-events:none}
  .mk.circ{border-radius:50%}
  .mk.box{border-radius:10px}
  .pin{position:absolute;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50%;background:var(--mark);color:#fff;display:grid;place-items:center;font:800 14px/1 'Assistant',Calibri,sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.22);pointer-events:none}

  .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:6px}
  .card{background:var(--closed);border:1px solid var(--line);border-radius:14px;padding:14px}
  .card h4{font-size:18px;color:var(--ink)}
  .card p{font-size:15.5px;margin:2px 0 10px}
  .warn{margin-top:8px;background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:15px}

  .done{margin-top:40px;background:var(--card);border-radius:18px;padding:26px 28px;text-align:center;box-shadow:0 8px 24px rgba(14,79,85,.08)}
  .done h2{font-size:26px;color:var(--teal-deep)}
  .done p{font-size:17px;color:var(--muted);margin-top:6px}
  .check{display:inline-block;width:18px;height:30px;border-right:4px solid #6fbf3b;border-bottom:4px solid #6fbf3b;transform:rotate(40deg);border-radius:0 0 3px 0;margin-inline-end:14px;vertical-align:-2px}

  /* ---- zoom ---- */
  .zoom{position:fixed;inset:0;background:rgba(10,30,32,.82);display:none;align-items:center;justify-content:center;padding:24px;z-index:50;cursor:zoom-out}
  .zoom.on{display:flex}
  .zoom .shot{width:min(1400px,96vw);max-height:92vh;cursor:zoom-out;border-radius:10px}
  .zoom .x{position:fixed;top:14px;left:18px;color:#fff;font:700 30px/1 'Assistant',Calibri,sans-serif}

  @media (max-width:820px){
    .row{grid-template-columns:1fr;gap:14px}
    .cards,.toc{grid-template-columns:1fr}
    .wrap{padding:20px 16px 50px}
    header.hero{padding:26px 18px}
    .step-h{padding:14px}
    .step-b{padding:4px 14px 20px}
    .st{font-size:18px}
  }
  @media print{
    .step-b{display:block!important}.tools,.chev{display:none}
    .step{break-inside:avoid;box-shadow:none}body{background:#fff}
  }
  .hero .home{display:block;text-align:start;font-weight:600;font-size:15px;color:var(--teal);text-decoration:none;margin:-14px 0 8px}
  .hero .home:hover{text-decoration:underline}
  /* ---- menu / chapter screens ---- */
  body:not(.in-ch) main, body.in-ch header.hero, .done{display:none}
  a.back-hub{display:inline-block;position:sticky;top:10px;z-index:5;box-shadow:0 4px 14px rgba(14,79,85,.14);margin:22px 4px 0;font-weight:700;font-size:16px;color:var(--teal);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 18px;text-decoration:none}
  a.back-hub:hover{background:var(--tip)}
  .chap .chapter{margin-top:22px}
  body.in-ch .part-h{margin-top:22px}
  /* call-outs drawn on the screenshot (like the course deck) */
  figure.co{margin:0 auto;width:100%}
  figure.co svg{display:block;width:100%;height:auto;background:var(--mat);border-radius:14px}
  .co-mark{fill:none;stroke:var(--mark);stroke-width:3.5}
  .co-line{stroke:var(--mark);stroke-width:3}
  .co-box{fill:#fff;stroke:var(--mark);stroke-width:3}
  .co-text{font-family:'Assistant',Calibri,sans-serif;font-weight:800;fill:#1b2430;text-anchor:middle;dominant-baseline:central;direction:rtl}
  .co-pin{fill:var(--mark)}
  .co-answer{stroke:#55626f;stroke-width:2;stroke-dasharray:6 5}
  .co-pointer{fill:#fff;stroke:#111;stroke-width:1.3;stroke-linejoin:round}
  .co-num{font:800 16px 'Assistant',Calibri,sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:central}
  /* one number at a time, like the deck: the step's "הבא" button reveals the next mark and its label */
  .co-item{transition:opacity .25s}
  .co-item.co-hide{opacity:0}
  button.co-next{display:block;margin:16px auto 2px;font:700 17px 'Assistant',Calibri,sans-serif;color:#fff;background:var(--teal);border:0;border-radius:999px;padding:9px 30px;cursor:pointer;box-shadow:0 3px 8px rgba(15,124,128,.25)}
  button.co-next:hover{background:var(--teal-deep)}
</style>
<style>
  .text a{color:var(--teal);font-weight:700}
  .text a.go{color:#fff}
</style>
</head>
<body>
{{BODY}}
<div class="zoom" id="zoom" role="dialog" aria-label="תמונה מוגדלת"><span class="x" aria-hidden="true">✕</span></div>
<script>
  const steps = [...document.querySelectorAll('.step')];
  const setOpen = (s, on) => { s.classList.toggle('open', on); s.querySelector('.step-h').setAttribute('aria-expanded', on); if (on && s.coReset) s.coReset(); };
  // one step open at a time; keep the opened step's header in view
  const openOnly = s => {
    steps.forEach(o => { if (o !== s) setOpen(o, false); });
    setOpen(s, true);
    requestAnimationFrame(() => {
      const top = s.getBoundingClientRect().top;
      if (top < 0 || top > innerHeight * 0.4) s.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  };
  steps.forEach(s => s.querySelector('.step-h').addEventListener('click', () =>
    s.classList.contains('open') ? setOpen(s, false) : openOnly(s)));

  // the first screen is the menu: one chapter shown at a time, all its steps closed until clicked.
  // the address (#ch-N) keeps the browser's back button working, and "#" returns to the menu.
  // marks appear one at a time: number 1 when the step opens, "הבא" adds the next;
  // after the last one, "הבא" moves on to the next step; at the end of a chapter it returns to the menu
  steps.forEach((st, idx) => {
    const items = [...st.querySelectorAll('.co-item')];
    const max = Math.max(0, ...items.map(i => +i.dataset.n));
    const btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'co-next';
    st.querySelector('.step-b').appendChild(btn);
    const next = steps[idx + 1];
    const last = !next || next.closest('.chap') !== st.closest('.chap');  // last step of its chapter
    let k = 1;
    const show = () => {
      items.forEach(i => i.classList.toggle('co-hide', +i.dataset.n > k));
      btn.textContent = (k >= max && last) ? 'סיום הפרק: לתוכן העניינים' : 'הבא ←';
    };
    btn.addEventListener('click', () => {
      if (k < max) { k++; show(); return; }
      if (last) location.hash = '';
      else openOnly(next);
    });
    st.coReset = () => { k = 1; show(); };
    show();
  });

  const route = () => {
    const c = document.getElementById(location.hash.slice(1));
    const on = !!(c && c.classList.contains('chap'));
    document.body.classList.toggle('in-ch', on);
    document.querySelectorAll('.chap').forEach(x => x.hidden = x !== c);
    document.querySelectorAll('.part').forEach(p => p.hidden = !(on && p.contains(c)));
    steps.forEach(o => setOpen(o, false));
    scrollTo(0, 0);
  };
  document.querySelectorAll('.toc button').forEach(b => b.addEventListener('click', () => location.hash = b.dataset.ch));
  addEventListener('hashchange', route);
  route();

  const zoom = document.getElementById('zoom');
  document.querySelectorAll('.shot').forEach(s => s.addEventListener('click', () => {
    zoom.querySelectorAll('.shot').forEach(n => n.remove());
    const c = s.cloneNode(true);
    const img = s.querySelector('img');
    const ratio = img.naturalWidth / img.naturalHeight;
    c.style.width = `min(1400px, 96vw, calc(92vh * ${ratio}))`;
    zoom.appendChild(c); zoom.classList.add('on');
  }));
  zoom.addEventListener('click', () => zoom.classList.remove('on'));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') zoom.classList.remove('on'); });
</script>
</body>
</html>
